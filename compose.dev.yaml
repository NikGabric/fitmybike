# Distinct project name from compose.yaml: otherwise both files define a `db`
# service under the same project and starting the production stack would adopt
# and reconfigure the development database container.
name: fitmybike-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitmybike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitmybike}
      POSTGRES_DB: ${POSTGRES_DB:-fitmybike}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - fitmybike_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fitmybike} -d ${POSTGRES_DB:-fitmybike}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fitmybike_pgdata:
