server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single origin, exactly as in development where Vite proxies /api. The browser
  # never learns the API is a separate service, so cookies stay first-party and
  # no CORS is involved anywhere.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback — client-side routes must resolve to index.html. Note this sits
  # *after* the /api block, so an unknown API path 404s from the API rather than
  # silently returning HTML.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
