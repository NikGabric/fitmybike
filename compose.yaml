# Production stack. For local development use compose.dev.yaml, which runs only
# Postgres while the API and web app run on the host with hot reload.
name: fitmybike

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    # Deliberately not published to the host: only the api service needs it.
    volumes:
      - fitmybike_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/nikgabric/fitmybike-api:${IMAGE_TAG:-latest}
    # `build` stays alongside `image` so `docker compose up --build` still works
    # locally; a server only ever runs `docker compose pull`, which needs the name.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-fmb_session}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      APP_URL: ${APP_URL:?set APP_URL}
      # Read by `docker compose exec api pnpm seed`. Compose's .env is used for
      # interpolation only and is NOT injected into containers, so without this line
      # the seed falls back to changeme123 — on a public host, and unfixable by
      # re-seeding, because the seed never updates an existing password.
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    # Migrations run in the entrypoint before the server starts.

  web:
    image: ghcr.io/nikgabric/fitmybike-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    # Deliberately publishes nothing: caddy reaches it on this network. Publishing it
    # would leave a plaintext copy of the app open beside the HTTPS one.
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Without these volumes Caddy re-issues on every deploy
      # and will hit Let's Encrypt rate limits within a day.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  fitmybike_pgdata:
  caddy_data:
  caddy_config:
