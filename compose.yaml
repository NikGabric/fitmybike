# Production stack. For local development use compose.dev.yaml, which runs only
# Postgres while the API and web app run on the host with hot reload.
name: fitmybike

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    # Deliberately not published to the host: only the api service needs it.
    volumes:
      - fitmybike_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-fmb_session}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      APP_URL: ${APP_URL:?set APP_URL}
    depends_on:
      db:
        condition: service_healthy
    # Migrations run in the entrypoint before the server starts.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api

volumes:
  fitmybike_pgdata:
